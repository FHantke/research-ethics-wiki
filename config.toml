baseURL = "https://fhantke.github.io/research-ethics-wiki/"
languageCode = "en-us"
title = "Research Ethics Wiki"
enableGitInfo = true
theme = "book"

[params]
  # Set source repository location.
  # Used for 'Last Modified' and 'Edit this page' links.
  BookRepo = 'https://github.com/FHantke/research-ethics-wiki/'

  # Link template for the latest commit shown at the bottom of docs pages.
  BookLastChangeLink = '{{ .Site.Params.BookRepo }}/commit/{{ .GitInfo.Hash }}'

  # Link template for "Edit this page" shown at the bottom of docs pages.
  BookEditLink = '{{ .Site.Params.BookRepo }}/edit/main/{{ .Path }}'

  # Configure the date format used on the pages
  # - In git information
  # - In blog posts
  BookDateFormat = 'January 2, 2006'

  # /!\ This is an experimental feature, might be removed or changed at any time
  # (Optional, experimental, default false) Enables service worker that caches visited pages and resources for offline use.
  BookServiceWorker = true

[taxonomies]
  topic = "Topics"
  category = "Categories"

[markup]
  [markup.highlight]
    style = "dracula"
